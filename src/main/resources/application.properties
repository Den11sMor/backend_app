spring.application.name=mastermartini-backend
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/master_martini?sslMode=REQUIRED&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:mastermartini}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DB_DDL:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=true
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600}
server.error.include-stacktrace=never
server.error.include-message=never
