name: Verificar backend
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # El runner ya incluye Maven; evita descargarlo otra vez con el wrapper.
      - run: mvn -B verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-backend
          path: target/site/jacoco/
